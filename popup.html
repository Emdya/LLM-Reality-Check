<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Check</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="root">
        <div class="popup-container">
            <div class="popup-background"></div>
            
            <div class="popup-content">
                <!-- Header -->
                <div class="popup-header">
                    <h1 class="popup-title">Reality Check</h1>
                    <svg class="popup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22,4 12,14.01 9,11.01"/>
                    </svg>
                </div>
                
                <!-- Status Display -->
                <div class="popup-status">
                    <div class="status-display" id="statusDisplay">
                        <div class="status-icon-container default" id="statusIconContainer">
                            <svg class="status-icon-svg" id="statusIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                <path d="M9 9h6v6H9z"/>
                            </svg>
                        </div>
                        <div class="status-text">
                            <p class="status-main" id="statusMain">Ready to fact-check AI content</p>
                            <p class="status-sub" id="statusSub">Click verify to analyze the current page</p>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="popup-actions" id="popupActions">
                    <button class="btn-primary" id="verifyBtn">Verify</button>
                </div>
                
                <!-- Footer -->
                <div class="popup-footer">
                    <p>Powered by AI fact-checking database</p>
                </div>
            </div>
            
            <!-- Decorative elements -->
            <div class="decoration decoration-1"></div>
            <div class="decoration decoration-2"></div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
